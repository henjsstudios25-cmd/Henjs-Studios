<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#0F0;
    font-family:'Courier New', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }

  /* CRT scanline overlay */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:2;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events:none;
    z-index:2;
  }

  .terminal{
    max-width:600px;
    width:100%;
    border:2px solid #0F0;
    padding:32px;
    background:rgba(0,20,0,0.4);
    box-shadow:0 0 24px rgba(0,255,0,0.25);
    position:relative;
    z-index:1;
  }

  .terminal-header{
    display:flex;
    justify-content:space-between;
    font-size:0.75rem;
    opacity:0.7;
    margin-bottom:20px;
    border-bottom:1px dashed #0F0;
    padding-bottom:10px;
  }

  #output{
    font-size:1rem;
    line-height:1.7;
    white-space:pre-wrap;
    min-height:220px;
  }

  .cursor{
    display:inline-block;
    width:9px;
    height:1.1em;
    background:#0F0;
    vertical-align:middle;
    animation:blink 0.8s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  .links{
    margin-top:24px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    opacity:0;
    transition:opacity 0.6s ease;
  }
  .links.show{opacity:1;}
  .links a{
    color:#0F0;
    text-decoration:none;
    border:1px solid #0F0;
    padding:8px 16px;
    font-size:0.85rem;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .links a:hover{background:#0F0; color:#000;}

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;}
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="terminal-header">
    <span>HENJS_OS v0.0.1</span>
    <span id="clock">--:--:--</span>
  </div>
  <div id="output"></div>
  <div class="links" id="links">
    <a href="index.html">&lt; RETURN</a>
    <a href="https://discord.gg/2VwsNdTxc2" target="_blank" rel="noopener">JOIN DISCORD FOR UPDATES</a>
  </div>
</div>

<script>
  const LINES = [
    "> initializing connection...",
    "> connection established.",
    "> ",
    "> HENJS STUDIOS x TINYDUDE GAMES",
    "> STATUS: something is in development.",
    "> DETAILS: [REDACTED]",
    "> ",
    "> one thing is certain -- trust no one.",
    "> ",
    "> further transmissions incoming. stay close."
  ];

  const output = document.getElementById('output');
  const linksEl = document.getElementById('links');
  const clockEl = document.getElementById('clock');

  function updateClock(){
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }
  updateClock();
  setInterval(updateClock, 1000);

  let lineIndex = 0;
  let charIndex = 0;
  let currentText = '';

  function typeNextChar(){
    if (lineIndex >= LINES.length) {
      output.innerHTML = currentText + '<span class="cursor"></span>';
      linksEl.classList.add('show');
      return;
    }

    const line = LINES[lineIndex];

    if (charIndex < line.length) {
      currentText += line[charIndex];
      charIndex++;
      output.innerHTML = currentText + '<span class="cursor"></span>';
      setTimeout(typeNextChar, 18 + Math.random() * 35);
    } else {
      currentText += '\n';
      lineIndex++;
      charIndex = 0;
      setTimeout(typeNextChar, 250);
    }
  }

  setTimeout(typeNextChar, 500);
</script>

</body>
</html>
